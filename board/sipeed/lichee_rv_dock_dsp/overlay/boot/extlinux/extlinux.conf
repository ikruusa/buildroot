label linux
  kernel /boot/Image
  # use devicetree from u-boot
  #
  # clk_ignore_unused: mainline's D1 CCU driver registers CLK_DSP and
  # CLK_BUS_DSP_CFG but nothing claims them, so clk_disable_unused() gates the
  # HiFi4 a few seconds into boot and the already-running DSP stops silently
  # (no fault flag). TEST SCAFFOLDING - the real fix is a DSP driver that
  # claims these clocks.
  #
  # root=PARTUUID, not /dev/mmcblk0p1: sunxi-mmc probes asynchronously and the
  # DTB has no mmc aliases, so the SD card and the SDIO host race for mmc0 and
  # swap between boots. The MBR disk signature is pinned to 0xC0FFEE in
  # genimage.cfg, which makes partition 1 always 00c0ffee-01.
  append console=ttyS0,115200 root=PARTUUID=00c0ffee-01 ro rootwait clk_ignore_unused
