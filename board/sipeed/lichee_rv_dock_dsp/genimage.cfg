# Minimal SD card image for the sipeed Lichee RV dock
#
# Same layout as board/sipeed/lichee_rv_dock/genimage.cfg, plus a fixed MBR
# disk signature. That gives partition 1 the stable PARTUUID 00c0ffee-01, so
# the kernel can find the rootfs no matter whether the SD card enumerates as
# mmc0 or mmc1 (sunxi-mmc probes asynchronously, so the two hosts race).
#
# See board/sipeed/lichee_rv_dock_dsp/overlay/boot/extlinux/extlinux.conf.

image sdcard.img {
	hdimage {
		disk-signature = 0xC0FFEE
	}

	partition u-boot {
		in-partition-table = false
		image = "u-boot-sunxi-with-spl.bin"
		offset = 8K
	}

	partition rootfs {
		partition-type = 0x83
		image = "rootfs.ext4"
		bootable = "true"
		offset = 1M
	}
}
