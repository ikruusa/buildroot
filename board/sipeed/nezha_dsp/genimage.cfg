# Minimal SD card image for the Sipeed Nezha (Allwinner D1, 1 GB)
#
# Same sunxi layout as the Lichee RV Dock: the SPL and U-Boot go at 8 KiB
# and the rootfs starts at 1 MiB.

image sdcard.img {
	hdimage {
	}

	partition u-boot {
		in-partition-table = false
		image = "u-boot-sunxi-with-spl.bin"
		offset = 8K
	}

	partition rootfs {
		partition-type = 0x83
		image = "rootfs.ext4"
		bootable = "true"
		offset = 1M
	}
}
