# Minimal SD card image for the Allwinner Nezha

image sdcard.img {
	hdimage {
		# Fixed MBR disk signature, so the kernel can mount the rootfs by
		# its PARTUUID (00c0ffee-01) instead of /dev/mmcblk0p1, whose
		# number depends on the MMC probe order (SD vs SDIO).
		disk-signature = 0xC0FFEE
	}

	partition u-boot {
		in-partition-table = false
		image = "u-boot-sunxi-with-spl.bin"
		offset = 8K
	}

	partition rootfs {
		partition-type = 0x83
		image = "rootfs.ext4"
		bootable = "true"
		offset = 1M
	}
}
